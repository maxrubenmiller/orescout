name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API — build & test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build OreScout.slnx -c Release
      - run: dotnet test OreScout.slnx -c Release --no-build --logger "console;verbosity=normal"

  web:
    name: Web — lint & build (React/TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  classifier:
    name: Rules engine — Tier-A fixtures (PostGIS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostGIS (applies db/01_init.sql + db/02_classifier.sql)
        run: docker compose up -d postgres
      - name: Wait for init to finish
        # Probe over TCP: during first-boot init Postgres only listens on its socket,
        # so a TCP answer means the init scripts have completed.
        run: |
          for i in $(seq 1 60); do
            docker compose exec -T postgres pg_isready -h 127.0.0.1 -U postgres -d miningapp && exit 0
            sleep 2
          done
          docker compose logs postgres
          exit 1
      - run: ./scripts/run-fixtures.sh
